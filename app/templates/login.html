<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · {{ app_name }}</title>
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
<main>
  <div class="login card">
    <div class="brand" style="margin-bottom:16px"><span class="logo">!</span>{{ app_name }}</div>
    {% if error %}<div class="banner banner-err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus required autocomplete="current-password">
      </div>
      <button class="btn btn-primary">Log in</button>
    </form>
    <p class="help" style="margin-top:14px">Forgot it? Add <code>DISABLE_AUTH=true</code> to this app's environment in compose,
      restart it, and set a new password in Settings.</p>
  </div>
</main>
</body>
</html>
